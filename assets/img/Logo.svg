<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
    <defs>
        <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7c3aed"/>
            <stop offset="55%" stop-color="#4f7cff"/>
            <stop offset="100%" stop-color="#22d3ee"/>
        </linearGradient>

        <radialGradient id="bgGrad" cx="35%" cy="35%" r="75%">
            <stop offset="0%" stop-color="#1b1640"/>
            <stop offset="55%" stop-color="#100c29"/>
            <stop offset="100%" stop-color="#07061a"/>
        </radialGradient>

        <linearGradient id="nebulaGrad" x1="0%" y1="30%" x2="100%" y2="70%">
            <stop offset="0%" stop-color="#4c1d95" stop-opacity="0"/>
            <stop offset="45%" stop-color="#7c3aed" stop-opacity="0.35"/>
            <stop offset="65%" stop-color="#b45cff" stop-opacity="0.18"/>
            <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
        </linearGradient>

        <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8b7bff"/>
            <stop offset="50%" stop-color="#5b7bff"/>
            <stop offset="100%" stop-color="#2fe8d8"/>
        </linearGradient>

        <clipPath id="circleClip">
            <circle cx="500.0" cy="500.0" r="446"/>
        </clipPath>

        <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="14" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <!-- soft glow halo: keeps the badge legible on both light and dark backgrounds -->
    <circle cx="500.0" cy="500.0" r="460" fill="none" stroke="url(#ringGrad)" stroke-width="16" opacity="0.6" filter="url(#softGlow)"/>

    <!-- thin white separation line: prevents the ring from blending into dark backgrounds -->
    <circle cx="500.0" cy="500.0" r="472" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.9"/>

    <!-- outer gradient ring -->
    <circle cx="500.0" cy="500.0" r="460" fill="none" stroke="url(#ringGrad)" stroke-width="16"/>

    <!-- background disc -->
    <circle cx="500.0" cy="500.0" r="446" fill="url(#bgGrad)"/>

