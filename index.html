<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nébula</title>

    <link rel="stylesheet" href="css.css">
</head>
<body>
    <header>
         <img src="/assets/img/Logo.svg" class="logo">
    
        <nav>
            <a href="#">Inicio</a>
            <a href="#">Nosotros</a>
            <a href="#">Contacto</a>
            
        </nav>
        <a href="#contacto" class="btn-contacto">
            <img src="/assets/img/contacto_neon.gif" alt="Contacto">
        </a>
    </header>
    <section class="hero">
        <div class="hero-text">
            <h1>Nebula</h1>
            <p>Es un diseñador digital especializado en paisajes espaciales futuristas.</p>
        </div>
    </section>
    <section class="galeria" align="center">
        <div>    
            <h1>Galeria de conciertos
            </h1>
            <hr>
            <div>
                <img src="/assets/img/concert1.webp">
                 <div class="card-info">
                    <h3>Nebulosa de la Laguna</h3>
                </div>
            </div>
            <div>
                 <img src="/assets/img/concert2.webp" alt="Nebulosa de Orión">
                <div class="card-info">
                    <h3>Nebulosa de Orión</h3>
                </div>
            </div>
            <div>
                 <img src="/assets/img/concert3.webp" alt="Nebulosa roja">
                <div class="card-info">
                    <h3>Nebulosa roja</h3>
                </div>
            </div>
        </div>
    </section>
    <section class="galeria" align="center">
        <h1>Video Demostracion</h1>
        <hr>
        <video controls width="640" poster="/assets/img/portada.webp">
            <source src="assets/video/video.mp4" type="video/mp4">
        </video>
    </section>

    
</body>
</html>
