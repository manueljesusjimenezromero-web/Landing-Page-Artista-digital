<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nébula</title>

    <link rel="stylesheet" href="css.css">
</head>
<body>
    <header>
         <img src="assets/img/Logo.svg" class="logo" width="200" height="70" loading="lazy">
    
        <nav>
            <a href="#">Inicio</a>
            <a href="#">Nosotros</a>
            <a href="#">Contacto</a>
            
        </nav>
        <a href="#contacto" class="btn-contacto">
            <img src="assets/img/contacto_neon.gif" alt="Botón de contacto con efecto neón" width="180" height="60" loading="lazy">
        </a>
    </header>
    <section  class="hero">
        <div class="hero-text">
            <h1>Nebula</h1>
            <p>Diseñador digital especializado en paisajes espaciales futuristas.</p>
        </div>
    </section>
    <section  class="galeria">
    <h1 >Galería de conciertos</h1>
    <hr>
 
    <div class="cards">
        <div class="card">
            <figure>
                <img src="assets/img/concert1.webp" alt="Nebulosa de la Laguna, nube de gas rosada y azulada con estrellas brillantes" width="1200" height="750" loading="lazy">
                <figcaption>
                    "Nebulosa de la Laguna" por Nebula, licencia
                  CC BY 4.0.
                </figcaption>
            </figure>
            <div class="card-info">
                <h3>Nebulosa de la Laguna</h3>
            </div>
        </div>
 
        <div class="card">
            <figure>
                <img src="assets/img/concert2.webp" alt="Nebulosa de Orión, nube de gas luminosa en tonos azules y anaranjados" width="1200" height="750" loading="lazy">
                <figcaption>
                    "Nebulosa de Orión" por Nebula, licencia
                    CC BY 4.0.
                </figcaption>
            </figure>
            <div class="card-info">
                <h3>Nebulosa de Orión</h3>
            </div>
        </div>
 
        <div class="card">
            <figure>
                <img src="assets/img/concert3.webp" alt="Nebulosa roja, nube cósmica de tonos rojizos sobre un fondo estrellado" width="1200" height="750" loading="lazy">
                <figcaption>
                    "Nebulosa roja" por Nebula, licencia
                   CC BY 4.0.
                </figcaption>
            </figure>
            <div class="card-info">
                <h3>Nebulosa roja</h3>
            </div>
        </div>
    </div>
</section>
    <section class="video" align="center">
        <h1>Video Demostracion</h1>
        <hr>
        <figure>
            <video controls poster="assets/img/poster.webp">
                <source src="assets/video/video.mp4" type="video/mp4" >
            </video>
            <figcaption>
                "Video demostración" por Nebula, licencia
                CC BY 4.0.
            </figcaption>
        </figure>
         <audio controls preload="none">
                <source src="assets/audio/audio.mp3" type="audio/mpeg">
                
        </audio>
    </section> 
    </main>
 
    <footer id="contacto">
        <p> 2026 Nebula</p>
    </footer>
</body>
</html>
